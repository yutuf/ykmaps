# Publishes the web app (public/) to GitHub Pages at ykmaps.kaymakci.us.
# The API stays on the home server; set the repository variable YK_API to its
# public URL (Settings -> Secrets and variables -> Actions -> Variables).
name: Pages

on:
  push:
    branches: [main]
    paths: ['public/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        env:
          YK_API: ${{ vars.YK_API }}
        run: |
          if [ -z "$YK_API" ]; then echo "::error::Set the YK_API repository variable to the server URL"; exit 1; fi
          mkdir -p _site
          cp -r public/. _site/
          printf "window.YK_API = '%s';\n" "$YK_API" > _site/config.js
          echo "ykmaps.kaymakci.us" > _site/CNAME
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
